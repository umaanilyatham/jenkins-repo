---
- name: deploy Web Application
  hosts : all
  become : yes
  tasks :
  - name : Install nginx
    apt :
      name : nginx
      state : present
      update_cache: yes

  - name : Copy website file
    copy :
      src : index.html
      dest : /var/www/html/index.html
  - name : Start nginx
    service :
      name : nginx
      state : started